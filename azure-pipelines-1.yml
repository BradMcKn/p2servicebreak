trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: TerraformInstaller@0
  inputs:
    terraformVersion: '1.x'

- task: TerraformCLI@0
  inputs:
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak' 
    backendType: 'azurerm'
    backendServiceArm: 'Terraform-AC' 
    backendAzureRmResourceGroupName: 'project2-resources' 
    backendAzureRmStorageAccountName: 'project2storageacct'  
    backendAzureRmContainerName: 'p2container'  
    backendAzureRmKey: 'terraform.tfstate'

- task: TerraformCLI@0
  inputs:
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak' 

- task: TerraformCLI@0
  inputs:
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak'
    environmentServiceNameAzureRM: 'Terraform-AC'  