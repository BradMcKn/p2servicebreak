trigger: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: TerraformInstaller@0
  inputs:
    terraformVersion: '1.x'

- task: TerraformCLI@0
  inputs:
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak' 

- task: TerraformCLI@0
  inputs:
    command: 'apply'  # This first apply creates the backend resources
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak'
    environmentServiceNameAzureRM: 'Terraform-AC' 

- task: TerraformCLI@0
  inputs:
    command: 'init'  # This init configures the backend
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak'
    backendType: 'azurerm'
    backendServiceArm: 'Terraform-AC'
    backendAzureRmResourceGroupName: 'terraform-state-rg' 
    backendAzureRmStorageAccountName: 'tfstatesa'  
    backendAzureRmContainerName: 'tfstate'  
    backendAzureRmKey: 'terraform.tfstate'

- task: TerraformCLI@0
  inputs:
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak'

- task: TerraformCLI@0
  inputs:
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)/p2servicebreak'
    environmentServiceNameAzureRM: 'Terraform-AC'
