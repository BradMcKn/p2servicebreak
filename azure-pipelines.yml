trigger: none

resources:
  repositories:
    - repository: self
      type: github
      name: BradMcKn/p2servicebreak

variables:
  TF_VAR_resource_group_name: project2-resources
  TF_VAR_storage_account_name: project2storageacct
  TF_BACKEND_CONTAINER_NAME: p2container
  TF_BACKEND_KEY: p2servicebreak/terraform.tfstate

stages:
- stage: Terraform
  jobs:
  - job: TerraformJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Checkout@1
      displayName: 'Checkout repository'

    - task: UseTerraform@0
      inputs:
        terraformVersion: '1.0.0'
      displayName: 'Set up Terraform'

    - script: |
        az login --identity
        terraform init \
          -backend-config="storage_account_name=$(TF_VAR_storage_account_name)" \
          -backend-config="container_name=$(TF_BACKEND_CONTAINER_NAME)" \
          -backend-config="key=$(TF_BACKEND_KEY)" \
          -backend-config="resource_group_name=$(TF_VAR_resource_group_name)"
      displayName: 'Terraform Init'

    - script: terraform validate
      displayName: 'Terraform Validate'

    - script: terraform plan
      displayName: 'Terraform Plan'

    - script: terraform apply -auto-approve
      displayName: 'Terraform Apply'
      condition: eq(variables['Build.SourceBranchName'], 'main')